name: ICT Trading Signals

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance pandas numpy requests
      
      - name: Run ICT Signal Generator
        run: |
          cd trading-signal-app/backend
          python run_ict_enhanced.py
      
      - name: Check for new signals
        id: check_signals
        run: |
          cd trading-signal-app/backend
          if [ -f .cache/generated_signals.json ]; then
            echo "signals_file=.cache/generated_signals.json" >> $GITHUB_OUTPUT
            NEW_SIGNALS=$(python -c "
import json
with open('.cache/generated_signals.json') as f:
    data = json.load(f)
intraday = [s for s in data if s.get('setup_type') in ['intraday', 'scalp']]
print(len(intraday))
            ")
            echo "new_count=$NEW_SIGNALS" >> $GITHUB_OUTPUT
          else
            echo "signals_file=" >> $GITHUB_OUTPUT
            echo "new_count=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Telegram Notification
        if: steps.check_signals.outputs.new_count > 0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd trading-signal-app/backend
          python -c "
import json
import os
import requests

with open('.cache/generated_signals.json') as f:
    signals = json.load(f)

intraday = [s for s in signals if s.get('setup_type') in ['intraday', 'scalp']]

if not intraday:
    exit(0)

bot_token = os.getenv('TELEGRAM_BOT_TOKEN')
chat_id = os.getenv('TELEGRAM_CHAT_ID')

if not bot_token or not chat_id:
    print('Telegram credentials not set')
    exit(1)

message = '🎯 <b>New ICT Signals Generated</b>\n\n'
for s in intraday:
    message += f\"<b>{s['asset']} {s['setup_type'].upper()} {s['direction'].upper()}</b>\n\"
    message += f\"Entry: {s['entry_price']:.5f} | SL: {s['stop_loss']:.5f} | TP1: {s['take_profit_1']:.5f}\n\"
    message += f\"R:R: {s['risk_reward']} | Conf: {s['confidence']:.0%}\n\"
    message += f\"Exp: {s['expiration_time_est']} EST ({s.get('kill_zone', 'N/A')})\n\"
    if s.get('notes'):
        message += f\"Note: {s['notes']}\n\"
    message += '\n'

url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
requests.post(url, json={
    'chat_id': chat_id,
    'text': message,
    'parse_mode': 'HTML'
})
print('Telegram sent')
          "
      
      - name: Upload signals artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-signals
          path: trading-signal-app/backend/.cache/generated_signals.json
          retention-days: 7
