name: ICT Trading Signals (Silent)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance pandas numpy requests

      - name: Run Silent ICT Signal Wrapper
        run: |
          cd trading-signal-app/backend
          python run_silent_ict.py > signals_output.json 2>&1

      - name: Check for valid signals
        id: check_signals
        run: |
          cd trading-signal-app/backend
          if [ -f signals_output.json ]; then
            OUTPUT=$(cat signals_output.json | tr -d '\n\r' | head -c 10)
            if [ "$OUTPUT" = "[SILENT]" ]; then
              echo "valid_signals=false" >> $GITHUB_OUTPUT
              echo "signal_count=0" >> $GITHUB_OUTPUT
            else
              SIGNAL_COUNT=$(python3 -c "
import json
try:
    with open('signals_output.json') as f:
        data = json.load(f)
    if isinstance(data, list):
        print(len(data))
    else:
        print(0)
except:
    print(0)
              ")
              if [ "$SIGNAL_COUNT" -gt 0 ]; then
                echo "valid_signals=true" >> $GITHUB_OUTPUT
                echo "signal_count=$SIGNAL_COUNT" >> $GITHUB_OUTPUT
              else
                echo "valid_signals=false" >> $GITHUB_OUTPUT
                echo "signal_count=0" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "valid_signals=false" >> $GITHUB_OUTPUT
            echo "signal_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: steps.check_signals.outputs.valid_signals == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd trading-signal-app/backend
          python send_telegram.py

      - name: Upload signals artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-signals
          path: trading-signal-app/backend/.cache/generated_signals.json
          retention-days: 7
